<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2280 1784" width="2280" height="1784" role="img" aria-label="Two-Audience Commenting — one thread split into two visibility lanes">
<defs>
 <radialGradient id="bg" cx="52%" cy="49%" r="78%"><stop offset="0%" stop-color="#0f1418"/><stop offset="46%" stop-color="#0a0d10"/><stop offset="100%" stop-color="#070609"/></radialGradient>
