 <radialGradient id="haloTeal" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(47,199,187,0.22)"/><stop offset="55%" stop-color="rgba(47,199,187,0.05)"/><stop offset="100%" stop-color="transparent"/></radialGradient>
