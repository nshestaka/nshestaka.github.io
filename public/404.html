<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      // SPA fallback for GitHub Pages: the case-study routes only exist client
      // side, so a direct hit / refresh lands here. We encode the requested
      // path into a query string and bounce to index.html, which restores it.
      // (Root deployment — no repo path segment to preserve.)
      var l = window.location
      var redirect =
        l.pathname.replace(/\/$/, '') +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      l.replace(l.origin + '/?/' + redirect.replace(/^\//, ''))
    </script>
  </head>
  <body></body>
</html>
